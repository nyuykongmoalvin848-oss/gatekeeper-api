openapi: 3.0.3
info:
  title: Gatekeeper API
  version: 1.0.0
  description: High-concurrency transactional ticketing system.
paths:
  /events:
    post:
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, venue, starts_at, capacity]
              properties:
                name: { type: string }
                venue: { type: string }
                starts_at: { type: string, format: date-time }
                capacity: { type: integer, minimum: 0 }
      responses:
        201:
          description: Created
        400:
          description: Invalid input Data
    get:
      summary: List events (Keyset Paginated)
      parameters:
        - name: after
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        200:
          description: OK
  /events/{id}/bookings:
    post:
      summary: Book tickets transactionally
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, quantity]
              properties:
                customer_id: { type: integer }
                quantity: { type: integer, minimum: 1, maximum: 10 }
      responses:
        201:
          description: Created
        400:
          description: Bad metadata / Invalid inputs
        409:
          description: Sold out / Event cancelled / Insufficient space

